name: Validate education case study

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required documentation
        run: |
          test -s README.md
          test -s docs/architecture.md
          test -s docs/assessment-engine.md
          test -s docs/reporting.md
          test -s docs/ai-assisted-marking.md
          test -s docs/data-model.md
      - name: Check Mermaid diagrams
        run: test "$(grep -RIl '```mermaid' README.md docs | wc -l)" -ge 4
